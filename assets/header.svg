    <rect x="0.5" y="0.5" width="1199" height="229" rx="17.5" stroke="#1E293B"/>
    <rect x="568" y="52" width="64" height="4" rx="2" fill="url(#accent)"/>
    <text x="600" y="126" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#F8FAFC" letter-spacing="0.5">Eric Uehling</text>
    <text x="600" y="172" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#94A3B8" letter-spacing="7">AI SOLUTIONS ARCHITECT</text>
  </g>
